<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOBNET MPC — AI Assistant Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0d10; color: #e5e7eb; min-height: 100vh; padding: 2rem 1.5rem; }
    header { display: flex; justify-content: space-between; align-items: center; max-width: 1300px; margin: 0 auto 2.5rem; border-bottom: 1px solid #1f2937; padding-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem; }
    .brand-title { font-size: 1.25rem; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
    .brand-subtitle { font-size: 0.78rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }
    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .key-btn { background: #1c222c; border: 1px solid #2d3544; color: #F5A800; font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.85rem; border-radius: 7px; cursor: pointer; transition: 0.2s; }
    .key-btn:hover { background: #252c38; }
    .badge { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; font-size: 0.8rem; font-weight: 600; padding: 0.35rem 0.85rem; border-radius: 9999px; border: 1px solid rgba(74, 222, 128, 0.3); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; max-width: 1300px; margin: 0 auto; }
    .card { background: #14171d; border: 1px solid #232832; border-radius: 14px; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #3b4252; }
    .avatar-wrapper { width: 100%; height: 110px; background: #1c2028; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; font-size: 2.5rem; }
    .bot-name { font-size: 1.1rem; font-weight: 700; color: #ffffff; }
    .bot-dept { font-size: 0.72rem; font-weight: 700; color: #F5A800; text-transform: uppercase; margin-bottom: 0.5rem; }
    .bot-desc { font-size: 0.82rem; color: #9ca3af; line-height: 1.4; margin-bottom: 1.25rem; flex-grow: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #1f242e; padding-top: 0.85rem; }
    .chat-btn { background: #D71920; color: #ffffff; border: none; font-size: 0.8rem; font-weight: 600; padding: 0.45rem 1rem; border-radius: 7px; cursor: pointer; transition: 0.15s; }
    .chat-btn:hover { background: #b5141a; }

    /* Modal Chat Window */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .chat-box { background: #14171d; border: 1px solid #2d3544; border-radius: 16px; width: 100%; max-width: 760px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .chat-header { background: #1c2028; padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232832; }
    .chat-header-info { display: flex; align-items: center; gap: 0.75rem; }
    .chat-header-avatar { font-size: 1.75rem; }
    .chat-header-title { font-size: 1rem; font-weight: 700; color: #ffffff; }
    .chat-header-sub { font-size: 0.75rem; color: #F5A800; text-transform: uppercase; }
    .close-btn { background: none; border: none; color: #9ca3af; font-size: 1.5rem; cursor: pointer; line-height: 1; }
    .close-btn:hover { color: #ffffff; }
    
    .chat-messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 88%; padding: 0.8rem 1.1rem; border-radius: 12px; font-size: 0.88rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #D71920; color: #ffffff; border-bottom-right-radius: 2px; }
    .msg.bot { align-self: flex-start; background: #1f242e; color: #e5e7eb; border-bottom-left-radius: 2px; border: 1px solid #2d3544; }
    .msg.system { align-self: center; background: #1c222c; color: #9ca3af; font-size: 0.78rem; border-radius: 6px; padding: 0.4rem 0.8rem; text-align: center; }
    .generated-img { max-width: 100%; border-radius: 8px; margin-top: 0.65rem; display: block; border: 1px solid #2d3544; }
    .download-link { display: inline-block; margin-top: 0.5rem; font-size: 0.8rem; color: #F5A800; text-decoration: underline; cursor: pointer; }

    /* Attachment Preview Bar */
    .file-preview-bar { display: none; background: #181d26; padding: 0.5rem 1rem; border-top: 1px solid #232832; font-size: 0.8rem; color: #9ca3af; align-items: center; justify-content: space-between; }
    .file-preview-bar.active { display: flex; }
    .file-remove-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; font-weight: bold; }

    .chat-input-bar { padding: 0.85rem 1rem; background: #1c2028; border-top: 1px solid #232832; display: flex; align-items: center; gap: 0.5rem; }
    .attach-btn { background: #1c222c; border: 1px solid #2d3544; color: #9ca3af; padding: 0.65rem 0.85rem; border-radius: 8px; cursor: pointer; font-size: 1.1rem; line-height: 1; transition: 0.2s; }
    .attach-btn:hover { color: #ffffff; border-color: #F5A800; }
    .chat-input { flex: 1; background: #0b0d10; border: 1px solid #2d3544; color: #ffffff; padding: 0.7rem 0.95rem; border-radius: 8px; font-size: 0.88rem; outline: none; }
    .chat-input:focus { border-color: #F5A800; }
    .send-btn { background: #D71920; color: #ffffff; border: none; padding: 0.7rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .send-btn:hover { background: #b5141a; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">JOBNET MULTIPURPOSE COOPERATIVE</div>
      <div class="brand-subtitle">Department AI Assistant Portal</div>
    </div>
    <div class="header-actions">
      <button class="key-btn" onclick="promptApiKey()">🔑 Set Gemini API Key</button>
      <div class="badge">● Online</div>
    </div>
  </header>

  <main class="grid" id="botGrid"></main>

  <!-- In-App Chat Modal -->
  <div class="modal-overlay" id="chatModal">
    <div class="chat-box">
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="chat-header-avatar" id="modalAvatar">🤖</div>
          <div>
            <div class="chat-header-title" id="modalTitle">Assistant</div>
            <div class="chat-header-sub" id="modalDept">Department</div>
          </div>
        </div>
        <button class="close-btn" onclick="closeChat()">&times;</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>

      <!-- File Attachment Banner -->
      <div class="file-preview-bar" id="filePreviewBar">
        <span id="filePreviewText">📎 Attached: file.pdf</span>
        <button class="file-remove-btn" onclick="removeAttachedFile()">&times;</button>
      </div>

      <div class="chat-input-bar">
        <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)" accept="image/*,application/pdf,text/plain" />
        <button class="attach-btn" title="Attach file, PDF, or photo" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="text" id="userInput" class="chat-input" placeholder="Ask anything, attach a document, or ask for an image..." onkeydown="handleKey(event)" />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const BOTS = [
      {
        id: "aldy",
        name: "Aldy",
        dept: "Marketing Specialist",
        desc: "Full-scale brand strategy, omnichannel social campaigns, Canva poster blueprints, copy, and member drives.",
        avatar: "📢",
        prompt: `You are Aldy, the Principal Marketing Specialist, Campaign Strategist, and Creative Director for JOBNET Multipurpose Cooperative (founded in 2010, motto: "Nurturing Your Future").

Core Operating Philosophy:
- You operate for an authentic, member-owned Cooperative under the CDA, NOT a commercial, shareholder-driven corporation.
- Every communication must treat members as co-owners and community partners ("kasosyo sa pag-asenso"), emphasizing democratic ownership, patronage refunds, shared growth, and community empowerment.
- Official Colors: Vibrant Red (#D71920), Warm Golden Yellow (#F5A800), Crimson Red (#940D12), Crisp White (#FFFFFF).
- Official Contacts: 09101258991 | jobnetmpc@gmail.com | ₱250 membership fee.

Your Unrestricted Scope:
1. Omnichannel Campaigns: Member drives, General Assembly promotions, raffles, product launches.
2. Full Copywriting: Social posts, video scripts, spiels, press releases, newsletters.
3. Visual Layout Blueprints: Step-by-step layout guides for Canva designers.
4. Image Prompts: Highly descriptive image prompts capturing Filipino cooperative community members.

Tone: Modern, energetic, trustworthy, community-centered, and practical.`
      },
      {
        id: "mau",
        name: "Mau",
        dept: "HR Guide",
        desc: "End-to-end people operations, DOLE labor standards, CDA compliance, disciplinary due process, and benefits.",
        avatar: "👥",
        prompt: `You are Mau, Lead Human Resources Consultant, Labor Law Specialist, and Head of People Operations for JOBNET Multipurpose Cooperative.
Advisory Authority: DOLE labor standards, 13th-month pay formulas, SSS, PhilHealth, Pag-IBIG, progressive discipline (NTE & due process), and mandatory CDA staff development. Tone: Highly professional, objective, legally rigorous.`
      },
      {
        id: "aiai",
        name: "Ai Ai",
        dept: "Credit & Savings Specialist",
        desc: "Comprehensive credit underwriting, 5 Cs risk analysis, amortization schedules, and capital build-up programs.",
        avatar: "💳",
        prompt: `You are Ai Ai, Chief Credit & Savings Specialist for JOBNET Multipurpose Cooperative.
Advisory Authority: 5 Cs credit underwriting, amortization schedules, diminishing balance math, PAR delinquent loan management, and capital build-up (CBU). Tone: Analytical, prudent, member-supportive.`
      },
      {
        id: "dang",
        name: "Dang",
        dept: "Operations Lead",
        desc: "Master operational conductor. Orchestrates all branches, aligns department leads, resolves operational bottlenecks, and executes strategic plans.",
        avatar: "⚙️",
        prompt: `You are Dang, the Chief Operations Lead and Branch Administration Director for JOBNET Multipurpose Cooperative.
Advisory Authority: Daily branch administration, teller/counter protocols, cash transit security, PMES verification, and cross-departmental coordination. Tone: Methodical, highly organized, proactive.`
      },
      {
        id: "jen",
        name: "Jen",
        dept: "Financial Advisor",
        desc: "Cooperative statutory accounting (RA 9520), net surplus allocation, patronage refunds, and treasury audits.",
        avatar: "📈",
        prompt: `You are Jen, Senior Financial Advisor and Cooperative Accounting Specialist for JOBNET Multipurpose Cooperative.
Advisory Authority: Statutory funds under RA 9520 (Reserve 10%, CETF 10%, CDF 3%, Optional 7%), Interest on Share Capital (ISC), Patronage Refund (PR) equations, cash flow audits. Tone: Precise, authoritative, mathematically rigorous.`
      },
      {
        id: "nj",
        name: "NJ",
        dept: "Nut Buying (Coconut)",
        desc: "Raw nut classification, copra moisture testing deductions, buying price matrices, and farmer logistics.",
        avatar: "🥥",
        prompt: `You are NJ, Head of Coconut & Copra Procurement for JOBNET Multipurpose Cooperative.
Advisory Authority: Whole dehusked nut grading, copra moisture meter deductions, buying price matrices, farmer receipts, and warehouse logistics. Tone: Direct, field-proven, practical.`
      },
      {
        id: "john",
        name: "John",
        dept: "Demo Farm Expert",
        desc: "High-yield agronomy, intercropping under coconuts, organic fertilization, crop cycles, and farm training.",
        avatar: "🌱",
        prompt: `You are John, Agronomy Specialist and Demo Farm Director for JOBNET Multipurpose Cooperative.
Advisory Authority: Coconut intercropping (cacao, coffee, banana, root crops), organic compost formulation, IPM pest mitigation, and farmer field school training. Tone: Knowledgeable, encouraging, hands-on.`
      },
      {
        id: "yong",
        name: "Yong",
        dept: "Executive Advisor (CEO)",
        desc: "Board resolutions, strategic growth roadmaps, CDA regulatory compliance, enterprise risk, and governance.",
        avatar: "🏛️",
        prompt: `You are Yong, Executive Strategy Advisor to the CEO and Board of Directors of JOBNET Multipurpose Cooperative.
Advisory Authority: Board Resolutions, CDA reportorial compliance, GA strategic planning, risk management, and cooperative scaling. Tone: Strategic, executive, high-level.`
      },
      {
        id: "vidz",
        name: "Vidz",
        dept: "Engineering Services",
        desc: "Facility maintenance, technical Scopes of Work (SOW), equipment upkeep, infrastructure, and safety audits.",
        avatar: "📐",
        prompt: `You are Vidz, Lead Facilities & Engineering Services Specialist for JOBNET Multipurpose Cooperative.
Advisory Authority: Preventive maintenance, electrical/civil inspections, contractor Scopes of Work (SOW), machinery uptime, and fire safety. Tone: Technical, precise, safety-first.`
      },
      {
        id: "jl",
        name: "JL",
        dept: "Motorpool Services Guide",
        desc: "Fleet dispatching, vehicle preventive maintenance, trip ticketing, fuel audits, and road logistics.",
        avatar: "🚚",
        prompt: `You are JL, Motorpool Director and Fleet Logistics Coordinator for JOBNET Multipurpose Cooperative.
Advisory Authority: Fleet dispatch, trip ticket controls, preventive maintenance routines, fuel consumption benchmarking (km/L), and driver road safety. Tone: Practical, logistics-minded, safety-focused.`
      }
    ];

    let currentBot = null;
    let chatHistory = [];
    let attachedFile = null;

    function renderGrid() {
      const grid = document.getElementById("botGrid");
      grid.innerHTML = BOTS.map(bot => `
        <div class="card">
          <div class="avatar-wrapper">${bot.avatar}</div>
          <div class="bot-name">${bot.name}</div>
          <div class="bot-dept">${bot.dept}</div>
          <div class="bot-desc">${bot.desc}</div>
          <div class="card-footer">
            <span></span>
            <button class="chat-btn" onclick="openChat('${bot.id}')">Chat &rarr;</button>
          </div>
        </div>
      `).join("");
    }

    function promptApiKey() {
      const existing = localStorage.getItem("jobnet_gemini_key") || "";
      const key = prompt("Enter your free Gemini API Key (from aistudio.google.com):", existing);
      if (key !== null) {
        localStorage.setItem("jobnet_gemini_key", key.trim());
        alert("API Key saved successfully!");
      }
    }

    function openChat(botId) {
      currentBot = BOTS.find(b => b.id === botId);
      document.getElementById("modalAvatar").textContent = currentBot.avatar;
      document.getElementById("modalTitle").textContent = currentBot.name;
      document.getElementById("modalDept").textContent = currentBot.dept;
      document.getElementById("chatMessages").innerHTML = `
        <div class="msg system">Connected to ${currentBot.name} (${currentBot.dept}). All systems and capabilities unlocked. Ask questions, attach files (📎), or request image generations!</div>
      `;
      chatHistory = [];
      removeAttachedFile();
      document.getElementById("chatModal").classList.add("active");
      document.getElementById("userInput").focus();
    }

    function closeChat() {
      document.getElementById("chatModal").classList.remove("active");
      removeAttachedFile();
    }

    function handleKey(e) {
      if (e.key === "Enter") sendMessage();
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 15 * 1024 * 1024) {
        alert("File too large. Please upload files under 15MB.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64Data = evt.target.result.split(',')[1];
        attachedFile = {
          name: file.name,
          mimeType: file.type || "application/pdf",
          data: base64Data
        };
        document.getElementById("filePreviewText").textContent = `📎 Attached: ${file.name}`;
        document.getElementById("filePreviewBar").classList.add("active");
      };
      reader.readAsDataURL(file);
    }

    function removeAttachedFile() {
      attachedFile = null;
      document.getElementById("fileInput").value = "";
      document.getElementById("filePreviewBar").classList.remove("active");
    }

    function isImageGenerationRequest(text) {
      const lower = text.toLowerCase();
      return (
        lower.startsWith("generate image") ||
        lower.startsWith("create image") ||
        lower.startsWith("make an image") ||
        lower.startsWith("draw") ||
        lower.includes("generate a photo") ||
        lower.includes("generate an image") ||
        lower.includes("create a poster graphic")
      );
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text && !attachedFile) return;

      const apiKey = (localStorage.getItem("jobnet_gemini_key") || "AQ.Ab8RN6JcHgMdK5nxZA0w3-O56fCUO5zkZ6H3LqKOsQRTNebrHw").trim();
      if (!apiKey) {
        promptApiKey();
        return;
      }

      const msgContainer = document.getElementById("chatMessages");

      // Append User Message
      let userBubbleHtml = escapeHtml(text);
      if (attachedFile) {
        userBubbleHtml += `<br><small style="opacity:0.85">📎 Attached: ${escapeHtml(attachedFile.name)}</small>`;
      }
      msgContainer.innerHTML += `<div class="msg user">${userBubbleHtml}</div>`;
      input.value = "";
      msgContainer.scrollTop = msgContainer.scrollHeight;

      // Loading bubble
      const loadingId = "load_" + Date.now();
      msgContainer.innerHTML += `<div class="msg bot" id="${loadingId}">Thinking...</div>`;
      msgContainer.scrollTop = msgContainer.scrollHeight;

      // 1. IMAGE GENERATION FLOW (Native Multimodal Image Model)
      if (isImageGenerationRequest(text)) {
        document.getElementById(loadingId).textContent = "🎨 Generating visual... Please wait a few seconds.";
        try {
          const imgRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { 
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: text }]
              }]
            })
          });

          const imgData = await imgRes.json();
          if (imgData.error) {
            document.getElementById(loadingId).textContent = `Image API Error: ${imgData.error.message || JSON.stringify(imgData.error)}`;
            return;
          }

          // Check if the response contains inline base64 image data
          let foundImg = null;
          let replyText = "";
          const parts = imgData.candidates?.[0]?.content?.parts || [];
          for (const p of parts) {
            if (p.inlineData && p.inlineData.data) {
              foundImg = `data:${p.inlineData.mimeType || 'image/png'};base64,${p.inlineData.data}`;
            } else if (p.text) {
              replyText += p.text + " ";
            }
          }

          if (foundImg) {
            document.getElementById(loadingId).innerHTML = `
              <div>${escapeHtml(replyText) || "Here is your generated visual:"}</div>
              <img src="${foundImg}" class="generated-img" alt="Generated visual" />
              <a href="${foundImg}" download="jobnet-graphic.png" class="download-link">⬇ Download Full Resolution</a>
            `;
          } else {
            document.getElementById(loadingId).textContent = replyText || "Could not generate image. Please try a more descriptive prompt.";
          }
        } catch (err) {
          document.getElementById(loadingId).textContent = `Image generation error: ${err.message}`;
        }
        msgContainer.scrollTop = msgContainer.scrollHeight;
        return;
      }

      // 2. STANDARD TEXT & DOCUMENT ANALYSIS FLOW
      const parts = [];
      if (attachedFile) {
        parts.push({
          inlineData: {
            mimeType: attachedFile.mimeType,
            data: attachedFile.data
          }
        });
      }
      if (text) {
        parts.push({ text: text });
      }

      chatHistory.push({ role: "user", parts: parts });
      removeAttachedFile();

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: currentBot.prompt }] },
            contents: chatHistory,
            generationConfig: {
              thinkingConfig: {
                thinkingLevel: "low"
              }
            }
          })
        });

        const data = await res.json();
        
        if (data.error) {
          document.getElementById(loadingId).textContent = `Google Error: ${data.error.message || JSON.stringify(data.error)}`;
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No text received from Gemini.";

        document.getElementById(loadingId).textContent = reply;
        chatHistory.push({ role: "model", parts: [{ text: reply }] });
      } catch (err) {
        document.getElementById(loadingId).textContent = `Connection error: ${err.message}`;
      }
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    renderGrid();
  </script>

</body>
</html>
